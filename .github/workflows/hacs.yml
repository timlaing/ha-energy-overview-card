name: HACS
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: plugin
          ignore: brands
