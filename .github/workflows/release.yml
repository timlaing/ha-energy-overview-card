name: Release asset
on:
  release:
    types: [published, released]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    name: Build release asset
    # Stable publications emit both events. Build them only on released;
    # published also covers prereleases, including those published from drafts.
    # Promoting a prerelease emits released and rebuilds the tagged asset.
    if: github.event.action == 'released' || (github.event.action == 'published' && github.event.release.prerelease)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Verify release version and main ancestry
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node -e 'const p = require("./package.json"); if (process.env.RELEASE_TAG !== "v" + p.version) process.exit(1);'
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: npm run build
      - run: node scripts/validate-hacs-package.mjs
      - name: Check release module syntax
        run: node --input-type=module --check < dist/energy-overview-card.js
      - name: Attach card module
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/energy-overview-card.js --repo "$GITHUB_REPOSITORY" --clobber

  validate-hacs:
    name: HACS release validation
    needs: release
    # The pinned HACS validator excludes prerelease assets (show_beta=false).
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # HACS reads GitHub, so wait until the asset has been uploaded. The
      # local wrapper pins the image as well as its configuration.
      - uses: ./.github/actions/hacs
        env:
          REPOSITORY_REF: ${{ github.event.release.tag_name }}
        with:
          category: plugin
          ignore: brands
          comment: false
