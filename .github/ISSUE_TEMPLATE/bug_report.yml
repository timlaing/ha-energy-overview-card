name: Bug report
description: Report a problem with this maintained fork.
title: '[Bug]: '
labels: [bug, needs-triage]
body:
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Home Assistant Core/frontend, card release or commit, browser and device.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include relevant console errors or screenshots.
    validations:
      required: true
  - type: textarea
    id: yaml
    attributes:
      label: Minimal card configuration
      description: Remove secrets and sensitive deployment details.
      render: yaml
