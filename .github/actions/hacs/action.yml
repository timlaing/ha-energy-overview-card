# Adapted from hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa (MIT).
# Image OCI source: hacs/integration@0704ffc6e790b9714c82384d8c564266434ff6f9.
# Unlike the upstream action, the executed container is immutable.
name: HACS release validator
description: Validate the published release with a digest-pinned HACS image.
inputs:
  category:
    description: HACS repository category.
    required: true
  ignore:
    description: Space-separated HACS checks to ignore.
    default: ''
  comment:
    description: Whether to post a validation comment.
    default: 'false'
  github_token:
    description: Read-only GitHub token for repository validation.
    default: ${{ github.token }}
runs:
  using: docker
  image: docker://ghcr.io/hacs/action@sha256:187499a09c5d41f9f0d42ff80d203ed87b974c028290140913b61e005fb0aab2
